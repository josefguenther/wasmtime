name: host-memory-image

on:
  push:
    branches: [ci/host-memory-image]

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true
    - uses: ./.github/actions/install-rust
    - run: rustup target add wasm32-wasip1 wasm32-unknown-unknown wasm32-wasip2
    - name: Host memory with a data segment, on unmodified main
      run: 'cargo test --test all -- memory_creator::'
